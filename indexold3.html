<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Math 172 · Standards Tracker</title><style>
:root{font:15px system-ui,Segoe UI,sans-serif;color:#17232d;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#17334a;color:white;padding:17px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px}header h1{font-size:21px;margin:0}header small{color:#c5d6e2}.wrap{max-width:1400px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,.button{font:inherit;cursor:pointer;border:1px solid #9eb1bf;background:white;border-radius:7px;padding:8px 12px;color:#17334a}button:hover{background:#e6edf1}button.active,.primary{background:#17334a;color:white;border-color:#17334a}button.active:hover,.primary:hover{background:#254b66}button:disabled{opacity:.5;cursor:default}input,select{font:inherit;border:1px solid #9eb1bf;border-radius:6px;padding:8px;max-width:100%;background:white}label{display:block;font-weight:600;margin:8px 0 5px}.card{background:white;border:1px solid #dae2e8;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 2px 7px #1d34400d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}.metric{font-size:27px;font-weight:750}.muted{color:#536673}.small{font-size:12px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:15px}.toolbar>div{min-width:160px}table{border-collapse:collapse;width:100%}th,td{padding:8px;border-bottom:1px solid #e3e9ed;text-align:left;vertical-align:middle}th{background:#edf2f5;position:sticky;top:0;z-index:1}tr:hover td{background:#fafcfd}.scroll{overflow:auto;max-height:68vh}.attempts{display:flex;gap:3px;flex-wrap:wrap}.pill{display:inline-block;min-width:25px;text-align:center;border-radius:5px;padding:3px 5px;font-weight:700}.P{background:#c7ecd5;color:#145334}.C{background:#cfe6fa;color:#174f79}.B{background:#fbe4b2;color:#805400}.N{background:#f8d2d2;color:#822e2e}.empty{background:#edf0f2;color:#677783}.rowgroup{background:#e5ecf1;font-weight:700}.note{background:#eef6fa;border-left:4px solid #347493;padding:12px;margin:12px 0}.danger{color:#8c2525}.right{text-align:right}.wide{width:100%}@media print{.print-only{display:inline!important}.attempt{display:none!important}header,nav,.no-print,.toolbar{display:none!important}.wrap{padding:0}.card{box-shadow:none;border:0}th{position:static}.scroll{max-height:none;overflow:visible}body{background:white;font-size:11px}td,th{padding:4px}}@media(max-width:650px){header{display:block}.wrap{padding:12px}th,td{padding:5px}}
#printPacket{display:none}@page{size:letter portrait;margin:.35in}@media print{body.print-packet header,body.print-packet main{display:none!important}body.print-packet #printPacket{display:block!important}body.print-packet{background:#fff;color:#111;font:8pt Arial,sans-serif}.print-sheet{break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid}.print-sheet:last-child{break-after:auto;page-break-after:auto}.print-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1.5pt solid #222;padding-bottom:5pt;margin-bottom:5pt}.print-head h2{font-size:13pt;margin:0 0 2pt}.print-head p{margin:0;color:#333}.print-summary{margin:0 0 5pt;font-size:8pt}.print-table{width:100%;table-layout:fixed;border-collapse:collapse;font:7.4pt Arial,sans-serif}.print-table th,.print-table td{border-bottom:.35pt solid #bbb;padding:2pt 3pt;line-height:1.15;vertical-align:middle}.print-table th{background:#eee!important;position:static;text-align:left}.print-table .group td{font-weight:bold;background:#eee!important;padding:3pt}.print-table .skill{width:38%}.print-table .shot{width:11%}.print-table .result{width:9%;text-align:right}.print-footer{display:flex;justify-content:space-between;border-top:1pt solid #777;margin-top:5pt;padding-top:4pt;font-size:7pt;color:#333}}
</style></head><body><header><div><h1>Math 172 · Standards Tracker</h1><small>Fall 2026 · Section 83301 · Instructor workspace</small></div><small id="saveStatus">Loading…</small></header><main class="wrap"><nav id="nav"></nav><div id="app"></div></main><div id="printPacket" aria-hidden="true"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
'use strict';
const SEED=[];
const GROUPS=[['UNIT 1 — Functions, Linear & Quadratic Models',[['FN1','Functions & vertical line test'],['FN2','Function notation'],['FN3','Domain, range, intercepts, inc/dec'],['LF1','Slope & avg. rate of change'],['LF2','Equations of lines'],['LF3','Graphing lines'],['LF5','Linear models & meaning'],['PR1','Graphing quadratics'],['PR2','Quadratic models & meaning'],['FN4','Transformations of functions'],['FN5','Combining & composing functions'],['FN6','Inverse functions']]],['UNIT 2 — Circular Functions',[['TR1','Degree & radian measure'],['TR2','Coterminal angles & arc length'],['TR5','Reference angles & unit circle'],['PF1','Sine & cosine graphs']]],['UNIT 3 — Exponential & Logarithmic Growth',[['EL1','Exponential functions & evaluating'],['EL2','Graphs of exponentials'],['EL3','Intro to logarithms'],['EL4','Graphs of logarithms'],['EL5','Properties of logarithms'],['EL6','Solving exp./log. equations'],['EL7','Modeling with exp./log. functions']]],['UNIT 4 — Trigonometric Reasoning & Structure',[['PF2','Tan/cot/sec/csc graphs'],['PF3','Inverse trig functions'],['TE4','Solving right triangles'],['TE5','Law of sines / law of cosines'],['TE6','Applications of trigonometry'],['TE1','Sum/diff. & double-angle formulas'],['TE2','Verifying identities'],['TE3','Solving trig equations']]],['UNIT 5 — Polynomial & Rational Structure',[['PR3','Graphs of polynomial functions'],['PR4','Polynomial long division'],['PR5','Zeros of polynomials'],['PR6','Rational equations'],['PR7','Graphs of rational functions'],['PR8','Quadratic inequalities'],['PR9','Rational inequalities']]]];
const STANDARDS=GROUPS.flatMap(g=>g[1].map(([code,title])=>({code,title,group:g[0]}))); const TIER={P:100,C:75,B:50,N:0};
const ASSESS=[['Quiz 1','FN1 FN2 FN3'],['Quiz 2','LF1 LF2 LF3 LF5 PR1 PR2'],['Quiz 3','FN4 FN5 FN6 TR1 TR2 TR5'],['Quiz 4','EL2 EL3 EL4 EL5'],['Quiz 5','EL6 EL7 PF2 PF3 TE4 TE5 TE6'],['Quiz 6','PR3 PR4 PR5 PR6'],['Exam 1','FN1 FN2 FN3 LF1 LF2 LF3 LF5 PR1 PR2 FN4 FN5 FN6 TR1 TR2 TR5 PF1'],['Exam 2','EL1 EL2 EL3 EL4 EL5 EL6 EL7 PF2 PF3 TE4 TE5 TE6 TE1 TE2 TE3'],['Final',STANDARDS.map(x=>x.code).join(' ')],['Custom',STANDARDS.map(x=>x.code).join(' ')]].map(([name,codes])=>({name,codes:codes.split(' ')}));
let client,state,view='entry',studentId='',entryCode='FN1',entryGroup=GROUPS[0][0],owner=null,writeQueue=Promise.resolve();
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(message){$('#saveStatus').textContent=message}
function writeDB(){
 const snapshot=JSON.parse(JSON.stringify(state));setStatus('Saving…');
 writeQueue=writeQueue.catch(()=>{}).then(async()=>{
  const {error}=await client.from('trackers').upsert({owner_id:owner,data:snapshot,updated_at:new Date().toISOString()},{onConflict:'owner_id'});
  if(error){setStatus('Save failed — retry or copy your entries');alert('Your latest change did not save: '+error.message);throw error}
  setStatus('Saved to Supabase · '+new Date().toLocaleTimeString());
 });return writeQueue
}
async function signIn(email,password){const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;owner=data.user.id;await loadState()}
async function loadState(){const {data,error}=await client.from('trackers').select('data').eq('owner_id',owner).maybeSingle();if(error)throw error;
 if(!data)throw Error('No class roster found. Create your instructor user and run setup.sql in Supabase first.');state=data.data;render()
}
function loginScreen(message=''){setStatus('Sign in to save');$('#nav').innerHTML='';$('#app').innerHTML=`<section class="card" style="max-width:480px;margin:auto"><h2>Instructor sign in</h2><p>Enter the email and password of the user you created in your Supabase project.</p><form id="login"><label>Email</label><input type="email" id="email" required class="wide" autocomplete="username"><label>Password</label><input type="password" id="password" required class="wide" autocomplete="current-password"><p><button class="primary">Sign in</button></p></form><p class="danger" id="login-error">${esc(message)}</p></section>`;$('#login').onsubmit=async e=>{e.preventDefault();try{await signIn($('#email').value,$('#password').value)}catch(err){$('#login-error').textContent=err.message}}}
function activeStudents(){const students=state.students.filter(x=>x.active!==false);const anthony=students.findIndex(x=>x.id==='7');const miguel=students.findIndex(x=>x.id==='8');if(anthony>=0&&miguel>anthony){const [student]=students.splice(miguel,1);students.splice(anthony,0,student)}return students}
function key(id,code){return id+'|'+code}function attempts(id,code){return state.attempts[key(id,code)]||[]}
function score(a){if(!a.length)return null;let v=a.map(x=>TIER[x.tier]).sort((x,y)=>y-x);if(v.length===1)return v[0];let hi=v[0],lo=v[1];return ({100:{100:100,75:90,50:75,0:50},75:{75:75,50:65,0:50},50:{50:50,0:25},0:{0:0}})[hi][lo]}
function mastery(id){return STANDARDS.reduce((sum,s)=>sum+(score(attempts(id,s.code))??0),0)/38}
function counts(id){let v={P:0,C:0,B:0,N:0,empty:0};for(let s of STANDARDS){let a=attempts(id,s.code);if(!a.length)v.empty++;else v[a.slice().sort((x,y)=>TIER[y.tier]-TIER[x.tier])[0].tier]++}return v}
function pill(t){return `<span class="pill ${t||'empty'}">${t||'—'}</span>`}function percent(v){return v==null?'—':(Math.round(v*10)/10)+'%'}
function component(id){return state.components[id]||{lrc:0,fluency:0,engagement:0}}
function overall(id){let c=component(id);return mastery(id)*.65+(Number(c.lrc)||0)/80*15+(Number(c.fluency)||0)/120*10+(Number(c.engagement)||0)/10*10}
function nav(){let names=[['entry','Enter results'],['students','Student view'],['overview','Class overview'],['backup','Setup & scoring']];$('#nav').innerHTML=names.map(([v,n])=>`<button class="${v===view?'active':''}" data-view="${v}">${n}</button>`).join('');$('#nav').onclick=e=>{let v=e.target.closest('[data-view]')?.dataset.view;if(v){view=v;render()}}}
function render(){nav();({entry:renderEntry,students:renderStudents,overview:renderOverview,backup:renderBackup})[view]()}
function renderEntry(){let standard=STANDARDS.find(x=>x.code===entryCode),date=new Date().toISOString().slice(0,10);
$('#app').innerHTML=`<section class="card"><h2>Enter results by standard</h2><p class="muted">Choose a category and standard, then enter attempt tiers for each student. Each change saves to Supabase. Blank is unattempted; N is a recorded Not yet.</p><div class="toolbar"><div><label for="category">Standard category</label><select id="category">${GROUPS.map(([g])=>`<option value="${esc(g)}" ${g===entryGroup?'selected':''}>${esc(g)}</option>`).join('')}</select></div><div><label for="standard">Standard</label><select id="standard">${GROUPS.find(([g])=>g===entryGroup)[1].map(([code,title])=>`<option value="${code}" ${code===entryCode?'selected':''}>${code} · ${esc(title)}</option>`).join('')}</select></div><div><label for="date">Date of entry</label><input type="date" id="date" value="${date}"></div></div><p class="small muted">${esc(standard.title)} · one attempt earns its full tier value. Select an existing result to change it; clear it to delete.</p><div class="scroll"><table><thead><tr><th>Student</th><th>Attempt 1</th><th>Attempt 2</th><th>Attempt 3</th><th>Attempt 4</th><th>Standard score</th></tr></thead><tbody>${activeStudents().map(st=>{let ar=attempts(st.id,entryCode);return `<tr><td>${esc(st.name)}</td>${[0,1,2,3].map(i=>`<td><select class="grade" data-id="${esc(st.id)}" data-index="${i}" aria-label="${esc(st.name)} attempt ${i+1}"><option value="">—</option>${Object.keys(TIER).map(t=>`<option value="${t}" ${ar[i]?.tier===t?'selected':''}>${t} · ${{P:'Proficient',C:'Capable',B:'Building',N:'Not yet'}[t]}</option>`).join('')}</select><div class="small muted">${esc(ar[i]?.date||'')}</div></td>`).join('')}<td><b>${percent(score(ar))}</b></td></tr>`}).join('')}</tbody></table></div></section>`;
$('#category').onchange=e=>{entryGroup=e.target.value;entryCode=GROUPS.find(([g])=>g===entryGroup)[1][0][0];render()};$('#standard').onchange=e=>{entryCode=e.target.value;render()};document.querySelectorAll('.grade').forEach(el=>el.onchange=async()=>{let id=el.dataset.id,i=Number(el.dataset.index),ar=attempts(id,entryCode),tier=el.value,enteredDate=$('#date').value;if(i>ar.length&&tier){alert('Enter earlier attempt slots first.');el.value='';return}if(i<ar.length){if(tier)ar[i]={tier,date:ar[i].date||enteredDate,source:'Attempt '+(i+1)};else ar.splice(i,1)}else if(tier)ar.push({tier,date:enteredDate,source:'Attempt '+(i+1)});state.attempts[key(id,entryCode)]=ar;const row=el.closest('tr');row.querySelectorAll('.grade').forEach((select,j)=>{select.value=ar[j]?.tier||'';select.nextElementSibling.textContent=ar[j]?.date||''});row.lastElementChild.querySelector('b').textContent=percent(score(ar));try{await writeDB()}catch(e){}})}
function renderStudents(){if(!studentId)studentId=activeStudents()[0]?.id;let st=activeStudents().find(x=>x.id===studentId),c=component(studentId),ct=counts(studentId);$('#app').innerHTML=`<div class="toolbar no-print"><div><label for="student">Student</label><select id="student">${activeStudents().map(x=>`<option value="${esc(x.id)}" ${x.id===studentId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><button id="print">Print student summary</button></div><section class="card"><h2>${esc(st.name)}</h2><div class="grid"><div><div class="muted">Standards mastery · 65%</div><div class="metric">${percent(mastery(studentId))}</div></div><div><div class="muted">Course grade to date*</div><div class="metric">${percent(overall(studentId))}</div></div><div><div class="muted">Standards with evidence</div><div class="metric">${38-ct.empty} / 38</div></div><div><div class="muted">Highest tier recorded</div><div>${pill('P')} ${ct.P} ${pill('C')} ${ct.C} ${pill('B')} ${ct.B} ${pill('N')} ${ct.N} · ${ct.empty} blank</div></div></div><p class="muted small">*Uses all 38 standards; unattempted standards and unentered course components contribute zero. This is a progress snapshot, not a prediction of the final grade.</p></section><section class="card no-print"><h3>Other course components</h3><div class="grid">${[['lrc','LRC packets','80'],['fluency','Foundational Fluency','120'],['engagement','Engagement & Self-Direction','10']].map(([k,n,max])=>`<div><label for="${k}">${n} · points out of ${max}</label><input type="number" id="${k}" min="0" max="${max}" step="0.5" value="${c[k]??0}"></div>`).join('')}</div><p class="muted small">Leave at 0 until you enter earned points. Adjust these whenever a checkpoint is graded.</p></section><section class="card"><h3>Standards and attempts</h3><div class="scroll"><table><thead><tr><th>Code and skill</th><th>Attempt 1</th><th>Attempt 2</th><th>Attempt 3</th><th>Attempt 4</th><th>Score</th></tr></thead><tbody>${GROUPS.map(([g,ss])=>`<tr><td colspan="6" class="rowgroup">${esc(g)}</td></tr>${ss.map(([code,title])=>{let ar=attempts(studentId,code);return `<tr><td><b>${code}</b> · ${esc(title)}</td>${[0,1,2,3].map(i=>`<td><button class="attempt no-print" data-code="${code}" data-index="${i}" title="${ar[i]?'Edit':'Add'} attempt">${pill(ar[i]?.tier)} <span class="small">${esc(ar[i]?.date||'')}</span></button><span class="print-only" style="display:none">${ar[i]?esc(ar[i].tier+' '+ar[i].date):'—'}</span></td>`).join('')}<td><b>${percent(score(ar))}</b></td></tr>`}).join('')}`).join('')}</tbody></table></div></section>`;
$('#student').onchange=e=>{studentId=e.target.value;render()};$('#print').onclick=()=>printSummaries([st]);for(let k of ['lrc','fluency','engagement'])$('#'+k).onchange=async e=>{let max={lrc:80,fluency:120,engagement:10}[k],v=Number(e.target.value);if(!Number.isFinite(v)||v<0||v>max){alert('Enter a value between 0 and '+max);render();return}state.components[studentId]={...component(studentId),[k]:v};await writeDB();render()};document.querySelectorAll('.attempt').forEach(el=>el.onclick=()=>editAttempt(studentId,el.dataset.code,Number(el.dataset.index)))}
async function editAttempt(id,code,index){let ar=attempts(id,code),old=ar[index];if(!old&&ar.length!==index){alert('Fill the earlier attempt slots first.');return}let tier=prompt(`${code} · attempt ${index+1}\nEnter P, C, B, N. Leave blank to delete this attempt.`,old?.tier||'');if(tier===null)return;tier=tier.trim().toUpperCase();if(tier&&!Object.hasOwn(TIER,tier)){alert('Use P, C, B, or N.');return}if(!tier){if(!old)return;if(!confirm('Delete this attempt?'))return;ar.splice(index,1)}else{let date=prompt('Date (YYYY-MM-DD):',old?.date||new Date().toISOString().slice(0,10));if(date===null)return;if(date&&!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Use YYYY-MM-DD.');return}let record={tier,date};if(old)ar[index]=record;else ar.push(record)}state.attempts[key(id,code)]=ar;await writeDB();render()}
function renderOverview(){let q=$('#app');q.innerHTML=`<section class="card"><h2>Class overview</h2><button id="print-class" class="primary">Print all student summaries to PDF</button><p class="muted">One page per active student, including all 38 standards and recorded attempts.</p><p class="muted">Scores use all 38 standards; unattempted standards contribute zero. Select a name to see their tracker.</p><div class="scroll"><table><thead><tr><th>Student</th><th>Mastery</th><th>Evidence</th><th>Other components</th><th>Course to date</th></tr></thead><tbody>${activeStudents().map(x=>{let c=component(x.id);return `<tr><td><button data-student="${esc(x.id)}">${esc(x.name)}</button></td><td>${percent(mastery(x.id))}</td><td>${38-counts(x.id).empty}/38</td><td class="small">LRC ${c.lrc||0}/80 · Fluency ${c.fluency||0}/120 · Engagement ${c.engagement||0}/10</td><td><b>${percent(overall(x.id))}</b></td></tr>`}).join('')}</tbody></table></div></section>`;$('#print-class').onclick=()=>printSummaries(activeStudents());q.querySelectorAll('[data-student]').forEach(el=>el.onclick=()=>{studentId=el.dataset.student;view='students';render()})}
function printSummaries(students){
 if(!students.length){alert('There are no active students to print.');return}
 const printDate=new Date().toLocaleDateString();
 $('#printPacket').innerHTML=students.map((st,index)=>`<section class="print-sheet"><div class="print-head"><div><h2>${esc(st.name)}</h2><p>Math 172 · Standards mastery · Fall 2026</p></div><div>${esc(printDate)}</div></div><p class="print-summary"><b>Mastery: ${percent(mastery(st.id))}</b> &nbsp; · &nbsp; Evidence on ${38-counts(st.id).empty} of 38 standards &nbsp; · &nbsp; One attempt earns its full tier value.</p><table class="print-table"><thead><tr><th class="skill">Standard and skill</th><th class="shot">Attempt 1</th><th class="shot">Attempt 2</th><th class="shot">Attempt 3</th><th class="shot">Attempt 4</th><th class="result">Score</th></tr></thead><tbody>${GROUPS.map(([group,ss])=>`<tr class="group"><td colspan="6">${esc(group)}</td></tr>${ss.map(([code,title])=>{const ar=attempts(st.id,code);return `<tr><td>${code} · ${esc(title)}</td>${[0,1,2,3].map(i=>`<td>${ar[i]?esc(ar[i].tier+' '+(ar[i].date||'')):'—'}</td>`).join('')}<td class="result">${percent(score(ar))}</td></tr>`}).join('')}`).join('')}</tbody></table><div class="print-footer"><span>P = Proficient · C = Capable · B = Building · N = Not yet · — = no attempt</span><span>${index+1} of ${students.length}</span></div></section>`).join('');
 document.body.classList.add('print-packet');
 const cleanup=()=>{document.body.classList.remove('print-packet');$('#printPacket').innerHTML='';window.removeEventListener('afterprint',cleanup)};
 window.addEventListener('afterprint',cleanup);
 requestAnimationFrame(()=>window.print());
}
function renderBackup(){let inactive=state.students.filter(x=>x.active===false);
$('#app').innerHTML=`<section class="card"><h2>Account and storage</h2><p>Results save to your Supabase project automatically. The indicator at the top confirms each save. Use this app on another computer with the same project configuration and instructor sign in.</p><button id="signout">Sign out</button><p class="small muted">Initial roster: ${state.students.length} names. The source roster contains names, IDs, and enrollment dates, but no drop status. Mark any students who have dropped below; their prior grades remain stored.</p><label for="archive">Remove a dropped student from class views</label><select id="archive"><option value="">Select student</option>${activeStudents().map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select> <button id="archive-button">Archive student</button>${inactive.length?`<h3>Archived students</h3>${inactive.map(x=>`<p>${esc(x.name)} <button data-restore="${esc(x.id)}">Restore</button></p>`).join('')}`:''}</section><section class="card"><h2>Scoring rules</h2><p>One attempt earns its full tier: P 100%, C 75%, B 50%, N 0%. With two or more attempts, the highest is the anchor and the second highest confirms it. All four attempts remain visible. Each of the 38 standards has equal weight in mastery.</p><div class="grid"><div><b>Anchor P</b><p>Second P 100 · C 90 · B 75 · N 50</p></div><div><b>Anchor C</b><p>Second C 75 · B 65 · N 50</p></div><div><b>Anchor B</b><p>Second B 50 · N 25</p></div><div><b>Anchor N</b><p>Second N 0</p></div></div><p>Course grade = 65% mastery + 15% LRC + 10% fluency + 10% engagement. Unattempted standards count as 0 in the current snapshot.</p></section>`;
$('#signout').onclick=async()=>{await client.auth.signOut();owner=null;state=null;loginScreen()};$('#archive-button').onclick=async()=>{let id=$('#archive').value,st=state.students.find(x=>x.id===id);if(!st)return;if(!confirm('Archive '+st.name+'? Their records will remain saved.'))return;st.active=false;if(studentId===id)studentId='';try{await writeDB()}catch(e){}render()};document.querySelectorAll('[data-restore]').forEach(el=>el.onclick=async()=>{state.students.find(x=>x.id===el.dataset.restore).active=true;try{await writeDB()}catch(e){}render()})}
(async()=>{try{if(!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY||window.SUPABASE_URL.includes('YOUR_PROJECT')){loginScreen('First add your Supabase project URL and publishable key to config.js.');return}if(!window.supabase?.createClient){loginScreen('Supabase library did not load. Check your internet connection.');return}client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const {data:{session}}=await client.auth.getSession();if(session){owner=session.user.id;await loadState()}else loginScreen()}catch(err){loginScreen(err.message)}})();
</script></body></html>
